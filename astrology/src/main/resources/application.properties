spring.application.name=astrology

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tuvi_ai?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=YourPasswordHere

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# OpenRouter - OpenAI-compatible API
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.chat.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.timeout=120s
spring.ai.openai.max-retries=3
